# Cursor CLI agent. Egress: Cursor's API hosts.
version = 1
name = "cursor-agent"
binaries = ["cursor-agent"]

[[egress]]
id = "cursor-api"
host = "api2.cursor.sh"
# The agent's own model API: not a write destination for the Rule of Two
# (what the agent sends goes only to the user's own account; ADR-039).
model_api = true

[[egress]]
id = "cursor-api-alt"
host = "api.cursor.com"

[agent]
config_readonly = ["~/.cursor/mcp.json", "~/.cursor/cli-config.json", "~/.cursor/rules"]
state_write = ["~/.cursor/chats"]
