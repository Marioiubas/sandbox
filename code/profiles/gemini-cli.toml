# Gemini CLI. Egress: the Gemini API and Google OAuth token endpoint.
version = 1
name = "gemini-cli"
binaries = ["gemini"]

[[egress]]
id = "gemini-api"
host = "generativelanguage.googleapis.com"
# The agent's own model API: not a write destination for the Rule of Two
# (what the agent sends goes only to the user's own account; ADR-039).
model_api = true
# API-key mode, brokered (I1): the sandbox sees a sentinel in GEMINI_API_KEY.
# Google-login mode (~/.gemini/oauth_creds.json) is not brokered yet
# (ADR-020) and fails closed.
credential = { kind = "static", id = "gemini-api-key", ref = "keychain:broker-gemini-api-key|env:GEMINI_API_KEY", header = "x-goog-api-key", env = "GEMINI_API_KEY" }

[[egress]]
id = "code-assist"
host = "cloudcode-pa.googleapis.com"

[[egress]]
id = "google-oauth"
host = "oauth2.googleapis.com"

[agent]
config_readonly = ["~/.gemini/settings.json", "~/.gemini/GEMINI.md", "~/.gemini/extensions"]
state_write = ["~/.gemini/tmp"]
