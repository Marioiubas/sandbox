# Claude Code (subscription / OAuth login). Egress: the Anthropic API and its
# auth and telemetry hosts. Agent configuration (settings, hooks, commands,
# MCP definitions) is read-only (I5); session transcripts and caches are
# writable agent state. Validate against each Claude Code release: paths
# are version-dependent.
#
# Credentials stay outside the sandbox (I1, M1): brokerd reads the OAuth
# access token Claude Code keeps in the macOS keychain (or, on Linux, in
# ~/.claude/.credentials.json, which the sandbox cannot read) and attaches it
# on api.anthropic.com. The agent sees only a sentinel in
# CLAUDE_CODE_OAUTH_TOKEN. API-key users: `--profile claude-code-apikey`.
version = 1
name = "claude-code"
binaries = ["claude"]

[[egress]]
id = "anthropic-api"
host = "api.anthropic.com"
# The agent's own model API: not a write destination for the Rule of Two
# (what the agent sends goes only to the user's own account; ADR-039).
model_api = true
credential = { kind = "static", id = "claude-oauth", ref = "keychain:Claude Code-credentials#claudeAiOauth.accessToken|file:~/.claude/.credentials.json#claudeAiOauth.accessToken", header = "authorization", scheme = "bearer", env = "CLAUDE_CODE_OAUTH_TOKEN" }

[[egress]]
id = "anthropic-telemetry"
host = "statsig.anthropic.com"

[[egress]]
id = "anthropic-console"
host = "console.anthropic.com"

[[egress]]
id = "claude-ai"
host = "claude.ai"

[[egress]]
id = "claude-platform"
host = "platform.claude.com"

[agent]
config_readonly = [
    "~/.claude/settings.json",
    "~/.claude/settings.local.json",
    "~/.claude/CLAUDE.md",
    "~/.claude/commands",
    "~/.claude/agents",
    "~/.claude/hooks",
    "~/.claude/plugins",
    "~/.claude/skills",
    "~/.claude/output-styles",
]
state_write = [
    "~/.claude/projects",
    "~/.claude/todos",
    "~/.claude/statsig",
    "~/.claude/shell-snapshots",
    "~/.claude/session-env",
    "~/.claude/file-history",
    "~/.claude/debug",
    "~/.claude/plans",
    "~/.claude/ide",
    # The Bash tool's per-project scratch directory (hard-coded under /tmp,
    # independent of TMPDIR). Only this project's directory, not its parent,
    # which other Claude Code sessions share.
    "/tmp/claude-${uid}/${cwd_slug}",
]
# No keychain access: the credential is brokered (ADR-020 ends the M0
# keychain exception of ADR-016).

[filesystem]
deny_read = ["~/.claude/.credentials.json"]
