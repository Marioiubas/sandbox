# OpenAI Codex CLI. Egress: the OpenAI API and ChatGPT sign-in hosts.
version = 1
name = "codex"
binaries = ["codex"]

[[egress]]
id = "openai-api"
host = "api.openai.com"
# The agent's own model API: not a write destination for the Rule of Two
# (what the agent sends goes only to the user's own account; ADR-039).
model_api = true
# API-key mode, brokered (I1): the sandbox sees a sentinel in OPENAI_API_KEY.
# ChatGPT-login mode keeps tokens in ~/.codex/auth.json, which the sandbox
# cannot read; it is not brokered yet (ADR-020) and fails closed.
credential = { kind = "static", id = "openai-api-key", ref = "keychain:broker-openai-api-key|env:OPENAI_API_KEY", header = "authorization", scheme = "bearer", env = "OPENAI_API_KEY" }

[[egress]]
id = "chatgpt"
host = "chatgpt.com"

[[egress]]
id = "openai-auth"
host = "auth.openai.com"

[agent]
config_readonly = [
    "~/.codex/config.toml",
    "~/.codex/AGENTS.md",
    "~/.codex/prompts",
    "~/.codex/rules",
]
state_write = [
    "~/.codex/sessions",
    "~/.codex/log",
]
