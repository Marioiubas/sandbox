# Public bypass corpus: destination host inputs that must be denied, with
# the reason the broker must log. Data only, so it can be published and run
# by other implementations. Each entry runs through every ingress mode
# (HTTP CONNECT and SOCKS5 domain form) and through the canonicaliser.
#
# `input` is a TOML basic string (escapes such as \u0000 allowed);
# `input_hex` gives raw bytes that are not valid UTF-8.
# `reason` is the broker's audit reason code. `category` is the conformance
# probe category (Conformance Probe Matrix). `via` restricts an entry to
# ingress modes where the bytes can be carried ("connect", "socks5").

[[case]]
id = "nul-suffix"
input = "attacker.example\u0000.google.com"
reason = "forbidden_byte"
category = 8
note = "sandbox-runtime SOCKS5 NUL-byte bypass: suffix check vs libc truncation"

[[case]]
id = "nul-leading"
input = "\u0000api.github.com"
reason = "forbidden_byte"
category = 8

[[case]]
id = "crlf-injection"
input = "example.com\r\nX-Injected: 1"
reason = "forbidden_byte"
category = 8
via = ["socks5"]
note = "CRLF inside CONNECT framing is rejected earlier as malformed_request"

