name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: code

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    # M0 matrix from the milestone note: macOS 15/26, Ubuntu 22.04/24.04.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 23.10+ gates unprivileged user namespaces behind AppArmor.
          # Grant userns to the system bwrap only (the installer's approach).
          # AppArmor 3.x (Ubuntu 22.04) cannot express `userns`; there the
          # runner-only fallback is to lift the gate for this CI VM.
          gate=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -f "$gate" ] && [ "$(cat "$gate")" = "1" ]; then
            sudo install -m 0644 packaging/apparmor/broker-bwrap /etc/apparmor.d/broker-bwrap
            sudo apparmor_parser -r /etc/apparmor.d/broker-bwrap || sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Canary SSH key (CI runners only)
        run: |
          mkdir -p ~/.ssh
          [ -e ~/.ssh/id_ed25519 ] || echo "CANARY-CI-NOT-A-KEY" > ~/.ssh/id_ed25519
      - name: Install cvc5 1.3.1 (formal gates; checksum-pinned)
        shell: bash
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)   asset=cvc5-Linux-x86_64-static; sum=1a1cda20d2df4938fa4944a69f33ddc9172e319ece0eed0aa09c4d7abede3ed1 ;;
            Linux-ARM64) asset=cvc5-Linux-arm64-static;  sum=fe2b661834a82fd8830f7a757c340f0e20041fa41e19b038fa02ace0eaf1c6f2 ;;
            macOS-ARM64) asset=cvc5-macOS-arm64-static;  sum=a0e7f5b03b1bc4284fbfff7cdfb08c704801701cf7ece83a13f8a505e7581215 ;;
            macOS-X64)   asset=cvc5-macOS-x86_64-static; sum=e7fe4af9491bd7c0db7591c0a483775735bd1a98b23933fd337a73ae39c10ff9 ;;
            *) echo "no cvc5 build for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/cvc5.zip" "https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.1/$asset.zip"
          echo "$sum  $RUNNER_TEMP/cvc5.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/cvc5.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/$asset/bin/cvc5" --version | head -1
          echo "CVC5=$RUNNER_TEMP/$asset/bin/cvc5" >> "$GITHUB_ENV"
          # A missing solver fails the gate tests instead of skipping them.
          echo "BROKER_REQUIRE_SOLVER=1" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --workspace --bins --locked
      - name: broker doctor
        run: ./target/debug/broker doctor
      - name: Formal gates (L5) on every shipped profile
        run: |
          export BROKER_HOME="$RUNNER_TEMP/gates-home"
          for p in profiles/*.toml; do
            ./target/debug/broker policy check --profile "$(basename "$p" .toml)"
          done
      - name: Tests (unit, pipeline, conformance, invariants)
        run: cargo test --workspace --no-fail-fast --locked

  ci-mode:
    # M3 D1: an attacker-authored issue drives a scripted agent through the
    # GitHub Action; nothing the agent can reach holds a job secret, and the
    # session is attributed to this run's OIDC identity.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: A job secret the agent must never see
        # Random per run and never written into the repository (a value in
        # this file would sit in the checked-out working tree).
        run: |
          c="ci-CANARY-$(openssl rand -hex 16)"
          echo "::add-mask::$c"
          echo "CANARY_JOB_SECRET=$c" >> "$GITHUB_ENV"
          echo "CANARY_HEX=$(printf %s "$c" | od -An -tx1 | tr -d ' \n')" >> "$GITHUB_ENV"
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          gate=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -f "$gate" ] && [ "$(cat "$gate")" = "1" ]; then
            sudo install -m 0644 packaging/apparmor/broker-bwrap /etc/apparmor.d/broker-bwrap
            sudo apparmor_parser -r /etc/apparmor.d/broker-bwrap || sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Build
        run: cargo build --workspace --bins --locked
      - name: Trust this runner's OIDC issuer
        run: |
          mkdir -p "$RUNNER_TEMP/broker/config"
          printf '%s\n' 'version = 1' '[[identity.oidc]]' \
            'issuer = "https://token.actions.githubusercontent.com"' 'audience = "broker-ci"' \
            > "$RUNNER_TEMP/broker/config/broker.toml"
          echo "BROKER_HOME=$RUNNER_TEMP/broker" >> "$GITHUB_ENV"
          # Installed outside the workspace: the agent may write its working
          # tree, and the broker refuses binaries inside a writable mount (I5).
          mkdir -p "$RUNNER_TEMP/bin"
          cp target/debug/broker target/debug/brokerd target/debug/broker-sandbox-shim target/debug/conformance-probe "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: The agent reads an untrusted issue (D1)
        uses: ./code/integrations/github-action
        with:
          audience: broker-ci
          command: sh code/tests/e2e/ci_untrusted_issue/agent.sh ${{ env.CANARY_HEX }}
      - name: The session is attributed to this run
        run: |
          broker audit query --kind session.start --json > "$RUNNER_TEMP/starts.jsonl"
          # Subject, issuer and run ID only (no token is ever logged).
          jq -c '.event | {enduser, issuer: .detail.identity.issuer, run_id: .detail.identity.claims.run_id}' "$RUNNER_TEMP/starts.jsonl"
          # The subject's format varies (it may embed owner and repository
          # IDs), so the check uses the repository and run ID claims.
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg run "$GITHUB_RUN_ID" \
            'select((.event.enduser | startswith("repo:"))
                    and (.event.detail.identity.claims.repository == $repo)
                    and (.event.detail.identity.claims.run_id == $run))' \
            "$RUNNER_TEMP/starts.jsonl" > /dev/null

  latency:
    # M4 E3: measured and reported (step summary), not gated; thresholds in
    # the L4 Product Metrics note. Debug build, loopback echo server.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          gate=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ -f "$gate" ] && [ "$(cat "$gate")" = "1" ]; then
            sudo install -m 0644 packaging/apparmor/broker-bwrap /etc/apparmor.d/broker-bwrap
            sudo apparmor_parser -r /etc/apparmor.d/broker-bwrap || sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Build
        run: cargo build --workspace --bins --locked
      - name: Measure
        run: |
          cargo test -p conformance --test m4_latency --locked -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/latency.txt"
          { echo '```'; grep -E "added p50|broker run --|audit append" "$RUNNER_TEMP/latency.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  fuzz-smoke:
    # 60 s per target on every push; the >=24 h runs are an M4 exit item.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: Fuzz each parser for 60 s
        run: |
          for t in canon connect socks5 sni jsonrpc pktline pack delta filter remote_url foreign github_route mcp_frame jwt s3_route device_flow; do
            cargo +nightly fuzz run --fuzz-dir tests/fuzz "$t" -- -max_total_time=60 -rss_limit_mb=2048
          done
